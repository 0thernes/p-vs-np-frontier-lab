name: Question
description: Ask about an archived paper, cryptographic digest, or verification command.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: checkboxes
    id: faq
    attributes:
      label: Checks
      options:
        - label: I checked docs/faq.md and README.md.
          required: true
