# SPDX-License-Identifier: Apache-2.0
# Informational-only verification workflow (Build Standard v1.2.0: R1-R4).
name: verify-p-vs-np-frontier-lab

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: p-vs-np-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  lean-6kernel:
    name: Zero-Mathlib Lean 4.35.0 (15 Targets & 6-Kernel Palomar Comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap for sandboxed multi-kernel replay
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install elan and pinned Lean 4.35.0 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clean Lean build, axiom audit, 6-kernel lake check & lake comparator
        working-directory: lean
        run: |
          lake build
          lake build PalomarChallenge
          lake env lean VerifyAxioms.lean | tee /tmp/lean_axioms.txt
          COUNT=$(grep -cE "depends on axioms:|does not depend on any axioms" /tmp/lean_axioms.txt)
          echo "Audited declaration count: $COUNT"
          test "$COUNT" -eq 25
          if grep -E "sorryAx|ofReduceBool|trustCompiler|_native" /tmp/lean_axioms.txt; then
            echo "FORBIDDEN AXIOM DETECTED" >&2
            exit 1
          fi
          cat <<'EOF' > _AdversarialFalseCheck.lean
          module
          import PVsNP.CircuitPhaseTransition
          theorem false_perm_eq_det_mod3 : PVsNP.permInt 2 (PVsNP.witnessMat 2) % 3 = PVsNP.detInt 2 (PVsNP.witnessMat 2) % 3 := by decide
          EOF
          if lake env lean _AdversarialFalseCheck.lean >/tmp/neg_elab.log 2>&1; then
            echo "ERROR: Lean elaboration failed to reject false theorem!" >&2
            rm -f _AdversarialFalseCheck.lean /tmp/neg_elab.log
            exit 1
          fi
          cat /tmp/neg_elab.log
          grep -qE "proved that the proposition|tactic .*decide.* failed|type mismatch" /tmp/neg_elab.log
          rm -f _AdversarialFalseCheck.lean /tmp/neg_elab.log
          echo "PASS: Negative elaboration test rejected false theorem with expected decide error."
          lake env leanchecker --fresh Solution
          lake env leanchecker-paranoid --fresh Solution
          lake check --paranoid
          lake comparator --config comparator.json --paranoid

  python-matrix:
    name: Exact Arithmetic, SAT Audit & Integrity Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install CaDiCaL SAT solver (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y cadical
          echo "CADICAL_BIN=$(command -v cadical)" >> "$GITHUB_ENV"
      - name: Install bundled CaDiCaL 2.1.2 via Lean 4.35.0 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
          CAD=$(find "$HOME/.elan/toolchains" -name cadical -type f | head -n 1)
          test -x "$CAD"
          echo "CADICAL_BIN=$CAD" >> "$GITHUB_ENV"
      - name: Install bundled CaDiCaL 2.1.2 via Lean 4.35.0 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1" -OutFile "$env:TEMP\elan-init.ps1"
          & "$env:TEMP\elan-init.ps1" -NoPrompt $true -DefaultToolchain "none"
          & "$env:USERPROFILE\.elan\bin\elan.exe" toolchain install leanprover/lean4:v4.35.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cad = Join-Path $env:USERPROFILE ".elan\toolchains\leanprover--lean4---v4.35.0\bin\cadical.exe"
          if (-not (Test-Path -LiteralPath $cad)) { throw "cadical.exe not found at $cad" }
          "CADICAL_BIN=$cad" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Run pytest suite
        run: python -m pytest -v tests/test_all.py
      - name: Run README axiom parity check
        run: python scripts/check_readme_axioms.py
      - name: Run offline bibliography key parity check
        run: python scripts/check_citations.py --offline
      - name: Run proof blueprint generator
        run: python scripts/build_blueprint.py
      - name: Verify SHA-256 provenance manifests (all OSes)
        run: |
          python -c "import hashlib, pathlib, sys
          for mf in ('MANIFEST.sha256', 'data/MANIFEST.sha256'):
              for line in pathlib.Path(mf).read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line or line.startswith('#'): continue
                  exp, rel = line.split('  ', 1)
                  got = hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest().lower()
                  assert got == exp.lower(), f'SHA mismatch on {rel} in {mf}'
          print('ALL SHA-256 MANIFESTS VERIFIED')"

  latex-paper-and-provenance:
    name: AMS-LaTeX White Paper, arXiv Bundle & SLSA Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Tectonic and compile white paper + standalone arXiv tarball
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          mkdir -p paper/build /tmp/arxiv_ci/out
          ./tectonic -X compile paper/main.tex --outdir paper/build
          tar -xzf dist/arxiv_submission.tar.gz -C /tmp/arxiv_ci
          ./tectonic -X compile /tmp/arxiv_ci/main.tex --outdir /tmp/arxiv_ci/out
      - name: Generate SHA256SUMS and attest build provenance (SLSA)
        run: |
          sha256sum dist/Donahue_2026_p_vs_np_barrier_anatomy.pdf dist/arxiv_submission.tar.gz MANIFEST.sha256 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/Donahue_2026_p_vs_np_barrier_anatomy.pdf
            dist/arxiv_submission.tar.gz
            MANIFEST.sha256
            SHA256SUMS

  lint-audit-security:
    name: Report-Only Linters, Secret Scan & Build Standard v1.2.0 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Report-only ruff & mypy
        continue-on-error: true
        run: |
          python -m pip install ruff mypy
          python -m ruff check experiments/ scripts/ tests/
          python -m mypy --ignore-missing-imports scripts/ tests/
      - name: Build Standard v1.2.0 self-audit
        continue-on-error: true
        run: bash scripts/audit-repo.sh .
      - name: Secret scan (gitleaks, report-only)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
