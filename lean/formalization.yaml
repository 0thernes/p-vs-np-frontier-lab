# SPDX-License-Identifier: Apache-2.0
# Formalization Ledger: P vs NP Frontier & Barrier Anatomy Lab
# Maps every paper theorem claim (C1-C14) to its exact Lean 4.35.0 statement in
# lean/Challenge.lean, proof witness in lean/Solution.lean, verbatim #print axioms
# footprint, and multi-kernel verification status.

schema_version: "1.0"
lean_toolchain: "leanprover/lean4:v4.35.0"
mathlib_dependency: false
module_headers_all_files: true
forbidden_token_hits: 0
total_lean_files: 13
total_lean_lines: 8078
max_file_lines: 2557

epistemic_boundary:
  p_vs_np_status: "OPEN"
  disclaimer: >
    No theorem in this repository proves P = NP or P != NP. All 14 Lean theorems
    establish unconditional complexity barriers, algebraic/combinatorial phase
    transitions, rigidity classifications, and exact zero-workspace algebraic
    reversibility bounds.

kernels_verified:
  - name: "lean (C++ reference kernel + VerifyAxioms.lean)"
    exit_code: 0
    scope: "All 15 exported theorems in Solution.lean; axioms strictly within [propext, Classical.choice, Quot.sound]"
  - name: "leanchecker (C++ external .olean replay)"
    exit_code: 0
    scope: "Solution.olean and full transitive import graph"
  - name: "leanchecker-paranoid (C++ paranoid .olean replay)"
    exit_code: 0
    scope: "Solution.olean with full paranoid definitional checks"
  - name: "con-leche --verified (Lean-in-Lean set-model-sound kernel)"
    exit_code: 0
    verdict: "con-leche: accepted 3982 declarations (--verified)"
    export_sha256: "7F981919BA1055E81695FBEDF2CE4A249F195129453DB3F39AF200EBB1BC764F"
  - name: "con-ron --verified (Aeneas-extracted verified Rust arena kernel)"
    exit_code: 0
    verdict: "con-ron: accepted 3982 declarations (--verified)"
    export_sha256: "7F981919BA1055E81695FBEDF2CE4A249F195129453DB3F39AF200EBB1BC764F"
  - name: "nanoda_bin 0.4.19 (independent Rust external typechecker)"
    exit_code: 0
    verdict: "Checked 4319 declarations with no typechecker errors (unpermitted_axiom_hard_error=true)"
    permitted_axioms: ["propext", "Classical.choice", "Quot.sound"]
    export_sha256: "7F981919BA1055E81695FBEDF2CE4A249F195129453DB3F39AF200EBB1BC764F"

toolchain_issues_documented:
  - name: "lean4lean (bundled v4.35.0 Windows binary)"
    exit_code: 1
    classification: "issue"
    diagnosis: >
      Upstream packaging mismatch in leanprover/lean4:v4.35.0 Windows bundle:
      lean4lean.exe rejects even Lean 4.35.0's own stdlib Init.Prelude.olean with
      'incompatible header'. Not a defect in this project.
  - name: "lake check (Windows host)"
    exit_code: 2
    classification: "issue"
    diagnosis: >
      Upstream Windows limitation: lake check requires Linux bwrap sandboxing and
      POSIX git on PATH. Direct invocation of all underlying bundled checkers
      succeeds with exit code 0 on Windows; Linux CI runs lake check natively.

