version: v0.4
project:
  name: 'P vs NP Frontier and Barrier Anatomy Lab: Zero-Mathlib Lean 4.35 Formalization of Classical Complexity
    Barriers'
  description: Zero-Mathlib Lean 4.35.0 formalization of 14 classical complexity-theoretic barrier theorems
    and supporting lemmas (Baker-Gill-Solovay dual relativization, Razborov-Rudich natural-proofs counting
    step, and classical supporting lemmas C1, C4-C14) across 15 isolated comparator targets, 5 non-vacuity
    witnesses, and 5 adversarial refutations strictly within [propext, Classical.choice, Quot.sound].
    Explicitly does NOT prove P = NP or P != NP; all formalized statements are known classical mathematics.
